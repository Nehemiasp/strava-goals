<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sin conexión · Goals</title>
<style>
  :root{color-scheme:light dark;--bg:#f4f4f1;--ink:#111214;--ink2:#55595f}
  @media (prefers-color-scheme:dark){:root{--bg:#0b0c0e;--ink:#f2f3f5;--ink2:#a6aab1}}
  body{margin:0;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:0 20px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h1{font-size:28px;line-height:34px;margin:0 0 8px}
  p{color:var(--ink2);margin:0 0 24px;line-height:24px}
  button{height:52px;border:0;border-radius:16px;background:#0b7a5c;color:#fff;font:inherit;font-weight:500;padding:0 24px}
</style>
</head>
<body>
<h1>Sin conexión</h1>
<p>Necesitamos internet para traer tus actividades de Strava. Vuelve a intentarlo cuando tengas señal.</p>
<button onclick="location.reload()">Reintentar</button>
</body>
</html>
